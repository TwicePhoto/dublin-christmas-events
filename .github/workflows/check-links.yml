name: Check event links

on:
  schedule:
    - cron: "37 5 * * *"   # every day, about 5:37am Dublin time in winter
  workflow_dispatch:
  push:
    paths:
      - tools/check_links.py
      - .github/workflows/check-links.yml

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every event's link
        env:
          REPORT_ONLY: "1"   # testing: report what it finds, change nothing
        run: python3 tools/check_links.py
      - name: Save changes to the feed
        run: |
          if git diff --quiet -- events.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "link-checker"
          git config user.email "link-checker@users.noreply.github.com"
          git add events.json
          git commit -m "$(cat link-check-summary.txt)"
          git pull --rebase origin main
          git push origin HEAD:main
